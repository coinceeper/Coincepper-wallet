org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
# Suppress Kotlin JVM target validation errors — needed because third-party plugins
# may compile with different Java/Kotlin JVM targets (e.g. screen_protector uses 17,
# flutter_custom_tabs_android uses 1.8). 'prop' = warn via property, not hard error.
kotlin.jvm.target.validation.mode=ignore
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
